name: Bug report
description: A result that is wrong, an error message, or a crash
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what went wrong.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: Script that shows the problem
      description: As short as you can make it. It will be formatted as Python.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If you compared with a known result, say which one.
  - type: input
    id: version
    attributes:
      label: SonoSK version
      description: Output of `python -c "import sonosk; print(sonosk.__version__)"`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12, Windows 11
