name: Feature or model request
description: A transducer, tissue, solver or measure you would like SonoSK to have
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to simulate
      description: The problem you are working on and what SonoSK is missing for it.
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Papers, standards or other software that describe the method.
  - type: dropdown
    id: help
    attributes:
      label: Could you help?
      options:
        - No, a request only
        - I can test it
        - I can provide data or reference results
        - I can write code for it
