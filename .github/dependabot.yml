version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    # a library keeps its lower bounds; only propose a change when the
    # newest release falls outside the allowed range
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
