name: Tissue property value
description: Suggest a measured acoustic or thermal property for the tissue database
labels: ["tissue data"]
body:
  - type: markdown
    attributes:
      value: >-
        Each value in the SonoSK tissue database comes from a published
        measurement. One issue per paper is easiest to check.
  - type: input
    id: tissue
    attributes:
      label: Tissue
      placeholder: breast fat, prostate peripheral zone, uterine fibroid
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Property, value and unit
      description: With frequency and temperature if the paper gives them.
      placeholder: |
        speed of sound: 1470 m/s at 37 C
        attenuation: 0.6 dB/(cm MHz) between 2 and 8 MHz
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (DOI or full reference)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Specimen type (in vivo, ex vivo, fixed), number of samples, spread of the values.
